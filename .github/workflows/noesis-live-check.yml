name: NOESIS live browser checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/noesis-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the published NOESIS website
        run: node tests/noesis-live-check.mjs
